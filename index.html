<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang kiểm tra liên kết...</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #0f172a; color: #f8fafc; }
    .box { text-align: center; padding: 24px; max-width: 420px; }
    .spinner { width: 36px; height: 36px; border: 4px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .warn { color: #fbbf24; font-size: 16px; font-weight: 600; line-height: 1.5; }
    a { color: #38bdf8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <div id="spinner" class="spinner"></div>
    <p id="status">Đang kiểm tra liên kết, vui lòng đợi...</p>
    <a id="fallback" href="#" style="display:none">Bấm vào đây nếu không tự chuyển trang</a>
  </div>
  <script>
    (function () {
      var RAILWAY_BASE = "https://worker-production-2a30b999.up.railway.app";

      var params = new URLSearchParams(window.location.search);
      var isStart = params.get("s") === "1";
      var spinner = document.getElementById("spinner");
      var statusEl = document.getElementById("status");
      var fallbackEl = document.getElementById("fallback");

      function showError(msg) {
        spinner.style.display = "none";
        statusEl.className = "warn";
        statusEl.textContent = "⚠️ " + (msg || "Không thể mở liên kết lúc này.");
      }

      if (isStart) {
        var q = new URLSearchParams({
          mode: "json",
          u: params.get("u") || "",
          n: params.get("n") || "",
          sig: params.get("sig") || ""
        });
        fetch(RAILWAY_BASE + "/entry?" + q.toString(), { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && data.ok && data.redirect) {
              fallbackEl.href = data.redirect;
              fallbackEl.style.display = "inline";
              window.location.replace(data.redirect);
            } else {
              showError(data && data.message);
            }
          })
          .catch(function () {
            showError("Lỗi kết nối máy chủ kiểm tra, vui lòng thử lại.");
          });
      } else {
        var goParams = new URLSearchParams({ mode: "json" });
        var toParam = params.get("to");
        if (toParam && /^https?:\/\//i.test(toParam)) {
          goParams.set("to", toParam);
        }
        fetch(RAILWAY_BASE + "/go?" + goParams.toString(), { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && data.ok && data.redirect) {
              fallbackEl.href = data.redirect;
              fallbackEl.style.display = "inline";
              window.location.replace(data.redirect);
            } else {
              showError(data && data.message);
            }
          })
          .catch(function () {
            showError("Không thể mở trực tiếp link gốc! Vui lòng lấy link từ bot Telegram.");
          });
      }
    })();
  </script>
</body>
</html>
