<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang chuyển hướng tải file...</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #0f172a; color: #f8fafc; }
    .box { text-align: center; padding: 24px; }
    .spinner { width: 36px; height: 36px; border: 4px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #38bdf8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Đang chuẩn bị link tải, vui lòng đợi...</p>
    <a id="fallback" href="#">Bấm vào đây nếu không tự chuyển trang</a>
  </div>
  <script>
    (function () {
      var RAILWAY_PING = "https://worker-production-2a30b999.up.railway.app/go";
      var DEFAULT_TARGET = "https://www.mediafire.com/file/n82m7dnuo9t9cmz/VALI+MODS+V96.apks.zip/file";

      var params = new URLSearchParams(window.location.search);
      var to = params.get("to") || DEFAULT_TARGET;
      if (!/^https?:\/\//i.test(to)) to = DEFAULT_TARGET;

      document.getElementById("fallback").href = to;

      try {
        fetch(RAILWAY_PING, { mode: "no-cors", keepalive: true }).catch(function () {});
      } catch (e) {}

      setTimeout(function () {
        window.location.replace(to);
      }, 250);
    })();
  </script>
</body>
</html>
