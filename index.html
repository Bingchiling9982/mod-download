<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang chuyển hướng tải file...</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #0f172a; color: #f8fafc; }
    .box { text-align: center; padding: 24px; }
    .spinner { width: 36px; height: 36px; border: 4px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #38bdf8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Đang chuẩn bị liên kết, vui lòng đợi...</p>
    <a id="fallback" href="#">Bấm vào đây nếu không tự chuyển trang</a>
  </div>
  <script>
    (function () {
      var RAILWAY_BASE = "https://worker-production-2a30b999.up.railway.app";
      var GTRAFFIC_FIXED = "https://gtraffic.io/F7KF19Q";
      var DEFAULT_TARGET = "https://www.mediafire.com/file/n82m7dnuo9t9cmz/VALI+MODS+V96.apks.zip/file";

      var params = new URLSearchParams(window.location.search);
      var isStart = params.get("s") === "1";

      var pingUrl, nextUrl;
      if (isStart) {
        // Bước 1: Cổng vào -> đi qua Railway /entry (lưu IP + tự 302 Redirect sang link /setglink mới nhất)
        var q = new URLSearchParams({
          u: params.get("u") || "",
          n: params.get("n") || "",
          sig: params.get("sig") || ""
        });
        window.location.replace(RAILWAY_BASE + "/entry?" + q.toString());
        return;
      } else {
        // Bước 2: Link gốc sau khi vượt gtraffic xong -> gửi IP về Railway /go -> chuyển sang MediaFire
        var to = params.get("to") || DEFAULT_TARGET;
        if (!/^https?:\/\//i.test(to)) to = DEFAULT_TARGET;
        pingUrl = RAILWAY_BASE + "/go";
        nextUrl = to;
      }

      document.getElementById("fallback").href = nextUrl;

      try {
        fetch(pingUrl, { mode: "no-cors", keepalive: true }).catch(function () {});
      } catch (e) {}

      setTimeout(function () {
        window.location.replace(nextUrl);
      }, 250);
    })();
  </script>
</body>
</html>
